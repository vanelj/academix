<!--
  Supabase > Authentication > Emails > Templates > "Reset password"
  Asunto sugerido: Restablece tu contraseña de Academix
  El enlace usa token_hash (funciona en cualquier navegador) y vuelve a
  /auth/restablecer, que verifica el enlace en el servidor.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:24px 12px;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:12px;border:1px solid #e2e8f0">
      <tr><td style="padding:20px 28px;border-bottom:1px solid #e2e8f0;font-size:18px;font-weight:700;color:#0f172a">Academix</td></tr>
      <tr><td style="padding:28px">
        <h1 style="margin:0 0 16px;font-size:21px;color:#0f172a">Restablece tu contraseña</h1>
        <p style="margin:0 0 14px;font-size:15px;line-height:1.6;color:#334155">Recibimos una solicitud para cambiar la contraseña de la cuenta {{ .Email }}.</p>
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:6px 0 18px"><tr><td style="border-radius:8px;background:#2563eb">
          <a href="{{ .SiteURL }}/auth/restablecer?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;padding:11px 20px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none">Crear una contraseña nueva</a>
        </td></tr></table>
        <p style="margin:0 0 8px;font-size:13px;line-height:1.5;color:#64748b">El enlace vence en una hora y solo puede usarse una vez.</p>
        <p style="margin:0;font-size:13px;line-height:1.5;color:#64748b">Si no lo solicitaste, ignora este correo: tu contraseña no cambiará.</p>
      </td></tr>
    </table>
  </td></tr>
</table>
